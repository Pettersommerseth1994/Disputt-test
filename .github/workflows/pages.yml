# Publishes the static (peer-to-peer) build of Disputt to GitHub Pages on every push to main.
# Optional repository variables (Settings > Secrets and variables > Actions > Variables) change what is built:
#   DISPUTT_SERVER_URL    wss://… address of a Disputt Node server. Set it and the site talks to that server instead of
#                         running peer-to-peer (see docs/DEPLOY.md).
#   DISPUTT_ICE_SERVERS   JSON array of WebRTC servers, e.g. a TURN server for networks that refuse direct connections.
#   DISPUTT_PEER_HOST / DISPUTT_PEER_PORT / DISPUTT_PEER_PATH / DISPUTT_PEER_SECURE   a self-hosted PeerJS server.
#   DISPUTT_PAYMENTS_URL + DISPUTT_PAYMENTS_KEY   switch payments on: the payment server's address and its public key (docs/SHOPIFY.md, or docs/BETALING.md for Stripe).
#   DISPUTT_PAYMENTS_PROVIDER (shopify, or stripe, the default), DISPUTT_PAYMENTS_METHODS (Stripe: vipps,applepay), DISPUTT_FREE_ROUNDS (2),
#   DISPUTT_TERMS_URL, DISPUTT_PRIVACY_URL   optional.
#   DISPUTT_PAYMENTS_DEMO (1)   a test copy only: payments with a pretend Stripe that lives in the page (docs/BETALING.md, "Demo uten Stripe").
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: pages
        uses: actions/configure-pages@v6
      # The terms and the privacy statement name the address customers write to. Until it is filled in they say KONTAKT-EPOST,
      # and payments must not go live with that.
      - name: Refuse to switch payments on while the terms are unfinished
        if: ${{ vars.DISPUTT_PAYMENTS_URL != '' }}
        run: |
          if grep -n 'KONTAKT-EPOST' public/vilkar.html public/personvern.html; then
            echo '::error::public/vilkar.html and public/personvern.html still say KONTAKT-EPOST. Put in the address customers write to first (docs/SHOPIFY.md).'
            exit 1
          fi
      - name: Build the static site
        run: node tools/pages/build.mjs --out dist --base "${{ steps.pages.outputs.base_path }}/"
        env:
          DISPUTT_MODE: ${{ vars.DISPUTT_SERVER_URL != '' && 'server' || 'p2p' }}
          DISPUTT_SERVER_URL: ${{ vars.DISPUTT_SERVER_URL }}
          DISPUTT_ICE_SERVERS: ${{ vars.DISPUTT_ICE_SERVERS }}
          DISPUTT_PEER_HOST: ${{ vars.DISPUTT_PEER_HOST }}
          DISPUTT_PEER_PORT: ${{ vars.DISPUTT_PEER_PORT }}
          DISPUTT_PEER_PATH: ${{ vars.DISPUTT_PEER_PATH }}
          DISPUTT_PEER_SECURE: ${{ vars.DISPUTT_PEER_SECURE }}
          DISPUTT_PAYMENTS_URL: ${{ vars.DISPUTT_PAYMENTS_URL }}
          DISPUTT_PAYMENTS_KEY: ${{ vars.DISPUTT_PAYMENTS_KEY }}
          DISPUTT_PAYMENTS_PROVIDER: ${{ vars.DISPUTT_PAYMENTS_PROVIDER }}
          DISPUTT_PAYMENTS_METHODS: ${{ vars.DISPUTT_PAYMENTS_METHODS }}
          DISPUTT_PAYMENTS_DEMO: ${{ vars.DISPUTT_PAYMENTS_DEMO }}
          DISPUTT_FREE_ROUNDS: ${{ vars.DISPUTT_FREE_ROUNDS }}
          DISPUTT_TERMS_URL: ${{ vars.DISPUTT_TERMS_URL }}
          DISPUTT_PRIVACY_URL: ${{ vars.DISPUTT_PRIVACY_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
